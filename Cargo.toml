[package]
name = "hyprland-focused-booster"
version = "0.1.7"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
systemd = { version = "0.11.1", default-features = false, features = [
  "journal",
] }
