# Dependabot config: one grouped monthly PR. No github-actions entry: this repo has no workflows.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    # Majors arrive as separate PRs (not ignored), so security fixes needing a major are not suppressed.
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
